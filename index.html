<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARDIK TOSS TIPS™</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at top,#102b55 0%,#070a10 48%,#000 100%);
  color:#fff;font-family:Arial,sans-serif;padding:20px;
}
.page{
  width:100%;max-width:440px;text-align:center;padding:28px 20px;
  border:1px solid #d4af37;border-radius:28px;
  background:rgba(3,6,12,.94);
  box-shadow:0 0 35px rgba(212,175,55,.35),inset 0 0 25px rgba(0,102,255,.08);
}
.profile{
  width:190px;height:190px;margin:auto;padding:7px;border-radius:50%;
  background:conic-gradient(#ffd700,#0066ff,#050505,#0066ff,#ffd700);
  box-shadow:0 0 20px rgba(255,215,0,.65),0 0 35px rgba(0,102,255,.4);
}
.profile img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;
  border:5px solid #050505;display:block;
}
h1{margin-top:20px;font-size:27px;color:#ffd84d;text-shadow:0 0 12px #0066ff}
.subtitle{margin-top:8px;color:#ddd;font-size:14px;letter-spacing:1px}
.timer-title{margin-top:25px;color:#aaa;font-size:13px}
#countdown{font-size:44px;font-weight:900;color:#ffd700;margin:5px 0 18px;text-shadow:0 0 18px #d4af37}
.join{
  display:block;text-decoration:none;color:#050505;font-size:18px;font-weight:900;
  padding:16px;border-radius:50px;
  background:linear-gradient(90deg,#ffd700,#fff0a0,#0066ff,#fff0a0,#ffd700);
  box-shadow:0 0 25px rgba(255,215,0,.45);transition:.2s;
}
.join:hover{transform:scale(1.04)}
.features{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;
}
.feature{
  padding:10px 4px;border:1px solid #2b66aa;border-radius:12px;
  background:rgba(0,55,120,.16);font-size:11px;color:#ddd;
}
.note{margin-top:16px;font-size:11px;color:#888}
</style>
</head>
<body>
<div class="page">

  <!-- आपकी भेजी हुई फोटो -->
  <div class="profile">
    <img src="profile.jpg" alt="HARDIK TOSS TIPS">
  </div>

  <!-- Headline -->
  <h1>HARDIK TOSS TIPS™</h1>
  <p class="subtitle">OFFICIAL TELEGRAM CHANNEL</p>

  <div class="timer-title">JOIN KARNE KE LIYE</div>
  <div id="countdown">30</div>

  <a class="join"
     href="https://t.me/+3bu2UG2MmKplMTg1"
     target="_blank" rel="noopener">
     🚀 JOIN TELEGRAM
  </a>

  <div class="features">
    <div class="feature">🎯<br>TOSS TIPS</div>
    <div class="feature">🏆<br>MATCH ANALYSIS</div>
    <div class="feature">📊<br>STATS & RECORDS</div>
  </div>

  <div class="note">🔒 Official Channel • Fast Access</div>
</div>

<script>
let seconds=30;
const timer=document.getElementById("countdown");
const interval=setInterval(()=>{
  seconds--;
  timer.textContent=seconds;
  if(seconds<=0){
    clearInterval(interval);
    timer.textContent="✓";
  }
},1000);
</script>
</body>
</html>
